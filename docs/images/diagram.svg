<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How capture-stream works</title>
  <desc id="d">A game console sends HDMI to a USB capture card on a Linux server. capture-streamd forwards the card's MJPEG frames unchanged over the local network to the Capture Stream app on a Mac, which decodes them in hardware. The controller stays connected to the console.</desc>
  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#f6f8fa"/>

  <g text-anchor="middle">
    <!-- console -->
    <rect x="30" y="80" width="190" height="110" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="125" y="125" font-size="22" font-weight="700" fill="#1f2328">Console</text>
    <text x="125" y="155" font-size="15" fill="#57606a">PS4 · PS5 · Switch · Xbox</text>
    <text x="125" y="175" font-size="15" fill="#57606a">any HDMI source</text>

    <!-- capture card -->
    <rect x="300" y="80" width="190" height="110" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="395" y="125" font-size="22" font-weight="700" fill="#1f2328">Capture card</text>
    <text x="395" y="155" font-size="15" fill="#57606a">USB / UVC</text>
    <text x="395" y="175" font-size="15" fill="#57606a">outputs MJPEG</text>

    <!-- server -->
    <rect x="570" y="70" width="230" height="130" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="685" y="112" font-size="22" font-weight="700" fill="#0a3069">Linux server</text>
    <text x="685" y="140" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a3069">capture-streamd</text>
    <text x="685" y="165" font-size="15" fill="#0550ae">frames sent unchanged,</text>
    <text x="685" y="185" font-size="15" fill="#0550ae">no re-encoding</text>

    <!-- mac -->
    <rect x="910" y="70" width="260" height="130" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
    <text x="1040" y="112" font-size="22" font-weight="700" fill="#0f3d1a">Mac</text>
    <text x="1040" y="140" font-size="16" fill="#0f3d1a">Capture Stream.app</text>
    <text x="1040" y="165" font-size="15" fill="#116329">hardware JPEG decode,</text>
    <text x="1040" y="185" font-size="15" fill="#116329">shown instantly</text>

    <!-- arrows -->
    <line x1="222" y1="135" x2="288" y2="135" stroke="#57606a" stroke-width="3"/>
    <polygon points="296,135 284,128 284,142" fill="#57606a"/>
    <text x="259" y="122" font-size="14" fill="#57606a">HDMI</text>
    <line x1="492" y1="135" x2="558" y2="135" stroke="#57606a" stroke-width="3"/>
    <polygon points="566,135 554,128 554,142" fill="#57606a"/>
    <text x="529" y="122" font-size="14" fill="#57606a">USB</text>
    <line x1="802" y1="135" x2="898" y2="135" stroke="#57606a" stroke-width="3"/>
    <polygon points="906,135 894,128 894,142" fill="#57606a"/>
    <text x="854" y="122" font-size="14" fill="#57606a">Wi-Fi / LAN</text>
    <text x="854" y="158" font-size="13" fill="#57606a">UDP</text>

    <!-- controller -->
    <text x="30" y="240" font-size="15" fill="#57606a" text-anchor="start">Controller stays paired to the console as usual</text>
    <text x="1040" y="240" font-size="15" fill="#57606a">~12 ms video · ~40 ms audio</text>
  </g>
</svg>
